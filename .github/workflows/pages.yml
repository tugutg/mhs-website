# OLD (GitHub Pages era, until 7 Nov 2026): published https://mhs.mn. Today it would only update GitHub Pages,
# which mhs.mn no longer points at. Builds the site from docs/ with tools/build_site.py and deploys it to GitHub Pages.
# Needs Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish site

# Since 7 Nov 2026 mhs.mn is hosted on Cloudflare Pages (see CLAUDE.md) and the owner keeps automation off
# GitHub, so this workflow runs only by hand. Don't add push or schedule triggers back without asking him.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Build the site from docs/
        run: python tools/build_site.py docs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
