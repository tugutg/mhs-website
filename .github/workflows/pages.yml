# Publishes https://mhs.mn: builds the site from docs/ with tools/build_site.py and deploys it to GitHub Pages.
# Needs Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
    # only when the site itself can change; edits to CLAUDE.md, README or the skill publish nothing
    paths:
      - "docs/**"
      - "tools/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Build the site from docs/
        run: python tools/build_site.py docs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
